<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zebra Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4f3ef; --card:#ffffff; --fg:#1c1c1a; --mute:#75736d; --line:#e0ded7;
    --acc:#1c1c1a; --acc-fg:#ffffff; --ok:#1f7a3f; --err:#b3261e; --warn:#9a6700;
    --paper:#fffdf8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --card:#1e1e1c; --fg:#ecebe6; --mute:#9b9993; --line:#33322e;
      --acc:#ecebe6; --acc-fg:#141413; --ok:#5bc27f; --err:#ff8a80; --warn:#e3b341; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button, select, input, textarea { font:inherit; color:inherit; }

  header { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; padding:12px 16px; }
  header h1 { font-size:19px; margin:0; flex:1; letter-spacing:-.01em; }
  .status { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--mute); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--mute); }
  .dot.on { background:var(--ok); } .dot.err { background:var(--err); }

  .btn { border:1px solid var(--acc); background:var(--acc); color:var(--acc-fg); border-radius:10px;
    padding:9px 14px; font-weight:600; cursor:pointer; }
  .btn.ghost { background:transparent; color:var(--fg); border-color:var(--line); }
  .btn.small { padding:6px 10px; font-size:14px; }
  .btn:disabled { opacity:.4; cursor:default; }

  main { display:grid; grid-template-columns:minmax(0,1fr); gap:18px; padding:16px; max-width:1100px; margin:0 auto 110px; }
  @media (min-width: 820px) { main { grid-template-columns:minmax(0,1fr) 430px; } .preview-col { position:sticky; top:72px; align-self:start; } }

  .seg { display:grid; grid-template-columns:1fr 1fr; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px; gap:4px; }
  .seg button { border:0; background:transparent; padding:10px 8px; border-radius:9px; font-weight:600; cursor:pointer; line-height:1.2; }
  .seg button small { display:block; font-weight:400; font-size:12px; color:var(--mute); }
  .seg button.active { background:var(--acc); color:var(--acc-fg); }
  .seg button.active small { color:inherit; opacity:.75; }

  .opts { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin:12px 2px; font-size:14px; color:var(--mute); }
  .opts label { display:flex; align-items:center; gap:6px; }
  select, input[type=text], input[type=number] { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  input[type=range] { width:120px; }

  .block { background:var(--card); border:1px solid var(--line); border-radius:14px; margin:10px 0; overflow:hidden; }
  .block-head { display:flex; align-items:center; gap:6px; padding:8px 10px 8px 14px; border-bottom:1px solid var(--line); }
  .block-head strong { flex:1; font-size:14px; }
  .icon-btn { border:1px solid var(--line); background:transparent; border-radius:8px; width:34px; height:30px; cursor:pointer; font-size:15px; }
  .block-body { padding:10px 14px 12px; }
  .block-body textarea { width:100%; min-height:110px; border:1px solid var(--line); border-radius:10px; padding:10px;
    background:transparent; resize:vertical; font:15px/1.45 ui-monospace, Menlo, monospace; }
  .block-body .opts { margin:8px 0 0; }
  .hint { font-size:12.5px; color:var(--mute); margin:6px 0 0; }

  .add { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 6px; }

  .preview-col h2 { font-size:14px; color:var(--mute); font-weight:600; margin:2px 0 8px; text-transform:uppercase; letter-spacing:.04em; }
  .preview { background:#d8d6cf; border-radius:14px; padding:16px; display:flex; flex-direction:column; align-items:center; gap:14px;
    max-height:calc(100vh - 230px); overflow:auto; }
  @media (prefers-color-scheme: dark) { .preview { background:#2a2a27; } }
  .preview canvas { width:100%; max-width:384px; height:auto; image-rendering:pixelated; background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .pinfo { font-size:13px; color:var(--mute); margin-top:8px; }
  .pinfo.warn { color:var(--warn); }

  .bar { position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--bg); border-top:1px solid var(--line);
    display:flex; align-items:center; gap:12px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar .grow { flex:1; min-width:0; }
  .progress { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:6px; display:none; }
  .progress > div { height:100%; width:0; background:var(--ok); transition:width .1s; }
  #msg { font-size:13.5px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #msg.err { color:var(--err); } #msg.ok { color:var(--ok); }
  .btn.print { padding:13px 22px; font-size:17px; }

  details.more { margin-top:18px; font-size:14px; color:var(--mute); }
  details.more summary { cursor:pointer; }
  #log { font:12px/1.5 ui-monospace, Menlo, monospace; white-space:pre-wrap; max-height:180px; overflow:auto; margin-top:8px; }
  .empty { color:var(--mute); font-size:14px; padding:18px; text-align:center; border:1px dashed var(--line); border-radius:14px; }
</style>
</head>
<body>
<header>
  <h1>Zebra Studio</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="state">Non connectée</span></div>
  <button class="btn small" id="btnConnect">Connecter</button>
</header>

<main>
  <section>
    <div class="seg" id="modeSeg">
      <button data-mode="tpe">Ticket long<small>papier continu, sans limite</small></button>
      <button data-mode="dymo">Étiquette DYMO<small>54 × 101 mm, à recoller</small></button>
    </div>

    <div class="opts">
      <label>Police
        <select id="gFont"></select>
      </label>
      <label id="frameWrap"><input type="checkbox" id="gFrame"> Cadre</label>
      <label>Copies <input type="number" id="gCopies" min="1" max="20" value="1" style="width:60px"></label>
    </div>

    <div id="blocks"></div>

    <div class="add">
      <button class="btn ghost small" data-add="text">+ Texte</button>
      <button class="btn ghost small" data-add="image">+ Image / PDF</button>
      <button class="btn ghost small" data-add="qr">+ QR code</button>
      <button class="btn ghost small" data-add="sep">+ Séparateur</button>
      <button class="btn ghost small" data-add="space">+ Espace</button>
      <button class="btn small" id="btnImport">Importer un fichier</button>
      <button class="btn ghost small" id="btnClear">Tout effacer</button>
    </div>
    <p class="hint">Fichiers acceptés : Markdown (.md), texte (.txt), images (JPG, PNG, HEIC…) et PDF. Dans les textes, {date} et {heure} sont remplacés à l'impression.</p>

    <details class="more">
      <summary>Réglages avancés et journal</summary>
      <div class="opts">
        <label>Taille des paquets Bluetooth
          <select id="chunk">
            <option value="20">20 octets (sûr)</option>
            <option value="100">100 octets</option>
            <option value="180">180 octets (rapide)</option>
          </select>
        </label>
        <button class="btn ghost small" id="btnCopyZpl">Copier le ZPL</button>
      </div>
      <div id="log"></div>
    </details>
  </section>

  <section class="preview-col">
    <h2>Aperçu impression</h2>
    <div class="preview" id="preview"></div>
    <div class="pinfo" id="pinfo"></div>
  </section>
</main>

<div class="bar">
  <div class="grow">
    <div id="msg">Prêt.</div>
    <div class="progress" id="progress"><div></div></div>
  </div>
  <button class="btn print" id="btnPrint">Imprimer</button>
</div>

<input type="file" id="fileAny" multiple hidden>
<input type="file" id="fileImage" accept="image/*,application/pdf,.pdf" hidden>

<script src="lib/qrcode.js"></script>
<script src="lib/qrcode_UTF8.js"></script>
<script src="lib/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
