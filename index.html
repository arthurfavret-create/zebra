<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFF6EA">
<title>Zebra Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@400;700&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#FFF6EA; --card:#FFFFFF; --ink:#1A1823; --mute:#8A8494; --line:#EFE6D8;
    --pink:#FF4F8B; --orange:#FF8A3D; --yellow:#FFC93C; --mint:#2FD39A; --violet:#7B61FF; --blue:#3EA6FF;
    --shadow:0 1px 2px rgba(26,24,35,.06), 0 8px 24px rgba(26,24,35,.07);
    --display:"Bricolage Grotesque", -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15131C; --card:#221F2B; --ink:#F4F1FA; --mute:#9C95AA; --line:#322E3D;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); }
    .sepview canvas, .swatches canvas { filter:invert(1) hue-rotate(180deg); opacity:.9; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button, input, textarea, select { font:inherit; color:inherit; }
  button { cursor:pointer; }

  /* ---------- En-tête ---------- */
  header { display:flex; align-items:center; gap:12px; padding:calc(14px + env(safe-area-inset-top)) 20px 6px; max-width:1180px; margin:0 auto; }
  .logo { width:40px; height:40px; border-radius:12px; flex:none; background:
      repeating-linear-gradient(-55deg, var(--ink) 0 6px, var(--card) 6px 12px); box-shadow:var(--shadow); }
  header h1 { font-family:var(--display); font-weight:800; font-size:26px; letter-spacing:-.02em; margin:0; flex:1; }
  header h1 span { color:var(--pink); }
  .pill { display:flex; align-items:center; gap:8px; border:0; background:var(--card); box-shadow:var(--shadow);
    padding:10px 16px; border-radius:999px; font-weight:600; font-size:14px; }
  .pill .dot { width:9px; height:9px; border-radius:50%; background:var(--mute); }
  .pill.on .dot { background:var(--mint); box-shadow:0 0 0 4px rgba(47,211,154,.18); }
  .pill.err .dot { background:var(--pink); }
  .round { width:42px; height:42px; border-radius:50%; border:0; background:var(--card); box-shadow:var(--shadow); font-size:18px; }

  main { display:grid; grid-template-columns:minmax(0,1fr); gap:24px; padding:12px 20px 140px; max-width:1180px; margin:0 auto; }
  @media (min-width:760px) { main { grid-template-columns:minmax(0,1fr) 360px; } .side { position:sticky; top:16px; align-self:start; } }
  @media (min-width:1000px) { main { grid-template-columns:minmax(0,1fr) 420px; } }

  /* ---------- Mode ---------- */
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .mode { position:relative; border:2px solid transparent; background:var(--card); box-shadow:var(--shadow); border-radius:20px;
    padding:14px 12px 14px 64px; text-align:left; min-height:74px; transition:transform .15s, border-color .15s; }
  .mode:active { transform:scale(.98); }
  .mode b { font-family:var(--display); font-size:18px; display:block; }
  .mode small { color:var(--mute); font-size:13px; }
  .mode.active { border-color:var(--ink); }
  .mode::before { content:""; position:absolute; left:18px; top:50%; transform:translateY(-50%); background:var(--bg); border:2px solid var(--ink); }
  .mode[data-mode=tpe]::before { width:30px; height:46px; border-radius:4px;
    -webkit-mask:linear-gradient(#000 0 0) top/100% 85% no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/8px 15% repeat-x;
    mask:linear-gradient(#000 0 0) top/100% 85% no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/8px 15% repeat-x;
    background:repeating-linear-gradient(var(--bg) 0 6px, var(--ink) 6px 8px); border:0; }
  .mode[data-mode=dymo]::before { width:30px; height:44px; border-radius:7px; }
  .mode.active[data-mode=tpe]::before { background:repeating-linear-gradient(var(--yellow) 0 6px, var(--ink) 6px 8px); }
  .mode.active[data-mode=dymo]::before { background:var(--yellow); }

  /* ---------- Polices ---------- */
  .chips { display:flex; gap:8px; overflow-x:auto; padding:14px 2px 6px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; border:0; background:var(--card); box-shadow:var(--shadow); border-radius:14px; padding:8px 14px; text-align:center; min-width:74px; }
  .chip .aa { font-size:24px; line-height:1.1; display:block; }
  .chip small { font-size:11px; color:var(--mute); }
  .chip.active { background:var(--ink); color:var(--bg); }
  .chip.active small { color:inherit; opacity:.7; }
  .toggle { display:inline-flex; align-items:center; gap:8px; border:0; background:var(--card); box-shadow:var(--shadow); border-radius:14px; padding:8px 14px; font-weight:600; font-size:14px; flex:none; }
  .toggle i { width:34px; height:20px; border-radius:10px; background:var(--line); position:relative; transition:background .15s; }
  .toggle i::after { content:""; position:absolute; left:2px; top:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .toggle.on i { background:var(--mint); } .toggle.on i::after { left:16px; }

  /* ---------- Blocs ---------- */
  #blocks { margin-top:10px; }
  .block { position:relative; background:var(--card); box-shadow:var(--shadow); border-radius:20px; margin:12px 0; padding:14px 16px 14px 22px;
    transition:box-shadow .15s, transform .15s; animation:pop .25s ease-out; }
  @keyframes pop { from { transform:scale(.96); opacity:0; } }
  .block::before { content:""; position:absolute; left:8px; top:14px; bottom:14px; width:5px; border-radius:3px; background:var(--c, var(--violet)); }
  .block.sel { box-shadow:0 0 0 2px var(--c, var(--violet)), var(--shadow); }
  .block[data-type=text] { --c:var(--violet); } .block[data-type=image] { --c:var(--pink); }
  .block[data-type=qr] { --c:var(--blue); } .block[data-type=sep] { --c:var(--yellow); } .block[data-type=space] { --c:var(--mint); }
  .block { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .block:not(.sel) textarea, .block:not(.sel) input { pointer-events:none; }
  .block.sel textarea, .block.sel input { -webkit-user-select:text; user-select:text; }
  .block.lifting { position:fixed; z-index:60; margin:0; pointer-events:none; animation:none; transform:scale(1.03) rotate(-1.2deg);
    box-shadow:0 0 0 2px var(--c), 0 24px 48px rgba(26,24,35,.28); transition:transform .15s; }
  .drop-ph { border:2px dashed var(--pink); border-radius:20px; margin:12px 0; background:rgba(255,79,139,.06); }
  .hint-move { text-align:center; color:var(--mute); font-size:13px; margin:10px 0 0; }
  .tools { position:absolute; right:10px; top:-16px; display:none; gap:4px; background:var(--ink); padding:4px; border-radius:12px; box-shadow:var(--shadow); z-index:2; }
  .block.sel .tools { display:flex; }
  .tools button { border:0; background:transparent; color:var(--bg); width:34px; height:30px; border-radius:8px; font-size:15px; }
  .tools button:active { background:rgba(255,255,255,.15); }

  .block textarea { width:100%; border:0; outline:0; background:transparent; resize:none; padding:0; min-height:28px; font-size:17px; line-height:1.45; overflow:hidden; }
  .block textarea::placeholder { color:var(--mute); }
  .more { display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); flex-wrap:wrap; gap:8px; align-items:center; }
  .block.sel .more { display:flex; }
  .seg { display:inline-flex; background:var(--bg); border-radius:12px; padding:3px; gap:2px; }
  .seg button { border:0; background:transparent; min-width:38px; height:34px; border-radius:9px; font-weight:700; font-size:14px; padding:0 10px; }
  .seg button.on { background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .fmt { display:inline-flex; gap:2px; background:var(--bg); border-radius:12px; padding:3px; }
  .fmt button { border:0; background:transparent; width:38px; height:34px; border-radius:9px; font-size:15px; font-weight:700; }
  .fmt button:active { background:var(--card); }
  .spacer { flex:1; }

  .thumb { display:flex; justify-content:center; background:var(--bg); border-radius:14px; padding:10px; }
  .thumb canvas { max-width:100%; max-height:220px; image-rendering:pixelated; }
  .slider { display:flex; align-items:center; gap:8px; font-size:18px; flex:1; min-width:200px; }
  .slider input { flex:1; accent-color:var(--pink); }
  .field { flex:1; min-width:180px; border:0; background:var(--bg); border-radius:12px; padding:10px 12px; outline:0; }
  .block[data-type=qr] .row { display:flex; gap:14px; align-items:center; }
  .block[data-type=qr] canvas { width:72px; height:72px; image-rendering:pixelated; flex:none; border-radius:6px; }
  .block[data-type=qr] .field { font-size:17px; background:transparent; padding:6px 0; }
  .sepview canvas { width:100%; height:auto; display:block; image-rendering:pixelated; }
  .swatches { display:flex; flex-wrap:wrap; gap:6px; }
  .swatches button { border:2px solid transparent; background:var(--bg); border-radius:10px; padding:6px; width:86px; height:40px; }
  .swatches button.on { border-color:var(--yellow); }
  .swatches canvas { width:100%; height:100%; }
  .spaceview { border:2px dashed var(--line); border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:13px; min-height:24px; }


  /* ---------- Éditeur d'étiquette ---------- */
  .tpls { display:flex; gap:10px; overflow-x:auto; padding:6px 2px 10px; scrollbar-width:none; }
  .tpls::-webkit-scrollbar { display:none; }
  .tpl { flex:none; width:132px; border:2px solid transparent; background:var(--card); box-shadow:var(--shadow); border-radius:16px; padding:8px 8px 6px; font-weight:700; font-size:13px; }
  .tpl.active { border-color:var(--pink); }
  .tpl .mini { height:70px; display:flex; align-items:center; justify-content:center; margin-bottom:6px; }
  .tpl canvas { max-width:100%; max-height:70px; border-radius:6px; box-shadow:0 0 0 1px var(--line); background:#fff; }
  .tpl .free { font-size:30px; }
  .lcard { background:var(--card); box-shadow:var(--shadow); border-radius:20px; padding:16px 18px; margin:12px 0; }
  .lcard .big { width:100%; border:0; outline:0; background:transparent; font-family:var(--display); font-weight:800; font-size:30px; padding:2px 0 6px; border-bottom:2px solid var(--line); }
  .lcard .big:focus { border-color:var(--pink); }
  .lcard .small { width:100%; border:0; outline:0; background:transparent; font-size:18px; padding:10px 0 6px; border-bottom:1px solid var(--line); }
  .lcard .small:focus { border-color:var(--pink); }
  .lrow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 0; }
  .lrow > .lab { width:72px; color:var(--mute); font-size:13px; font-weight:600; flex:none; }
  .detailwrap { display:flex; gap:8px; align-items:center; }
  .detailwrap .small { flex:1; }
  .mini-chip { border:0; background:var(--bg); border-radius:10px; padding:7px 10px; font-weight:700; font-size:13px; flex:none; }
  .icons { display:flex; flex-wrap:wrap; gap:6px; }
  .icons button { width:40px; height:40px; border:2px solid transparent; background:var(--bg); border-radius:12px; font-size:20px; }
  .icons button.on { border-color:var(--pink); }
  .frames { display:flex; flex-wrap:wrap; gap:6px; }
  .frames button { width:62px; height:40px; border:2px solid transparent; background:var(--bg); border-radius:10px; padding:4px; }
  .frames button.on { border-color:var(--pink); }
  .frames canvas { width:100%; height:100%; }
  .orient { display:inline-flex; gap:6px; }
  .orient button { display:flex; align-items:center; gap:8px; border:2px solid transparent; background:var(--bg); border-radius:12px; padding:8px 12px; font-weight:700; font-size:14px; }
  .orient button.on { border-color:var(--pink); }
  .orient i { display:inline-block; border:2px solid currentColor; border-radius:3px; }
  .tip { display:flex; gap:10px; align-items:flex-start; background:linear-gradient(120deg, rgba(123,97,255,.12), rgba(255,79,139,.12)); border-radius:16px; padding:12px 14px; font-size:14px; margin:12px 0 0; }
  .tip b { font-family:var(--display); }
  .paper.land canvas { border-radius:12px; }


  /* ---------- Claude ---------- */
  .ai-btn { border:0; border-radius:12px; height:40px; padding:0 14px; font-weight:700; color:#fff; background:linear-gradient(120deg, #D97757, var(--pink)); }
  #aiSheet textarea { width:100%; min-height:150px; border:0; outline:0; background:var(--bg); border-radius:16px; padding:14px; font-size:17px; line-height:1.45; resize:vertical; }
  #aiSheet .hint { color:var(--mute); font-size:13.5px; margin:8px 2px 12px; }
  #aiSheet .go { width:100%; height:54px; border:0; border-radius:16px; color:#fff; font-family:var(--display); font-weight:800; font-size:18px; background:linear-gradient(120deg, #D97757, var(--pink)); }
  #aiSheet .go:disabled { opacity:.6; }
  #aiSheet .result { background:var(--bg); border-radius:16px; padding:14px 16px; margin:14px 0; }
  #aiSheet .result h4 { font-family:var(--display); font-size:20px; margin:0 0 6px; }
  #aiSheet .row2 { display:flex; gap:8px; margin-top:10px; }
  #aiSheet .row2 input { flex:1; border:0; background:var(--bg); border-radius:12px; padding:12px; font-size:16px; outline:0; }
  #aiSheet .row2 button, #aiSheet .use { border:0; border-radius:12px; padding:0 16px; font-weight:700; background:var(--ink); color:var(--bg); }
  #aiSheet .use { width:100%; height:50px; margin-top:10px; font-size:16px; }
  .thinking { display:inline-block; animation:pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { to { opacity:.35; } }

  /* ---------- Ajout ---------- */
  .adds { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:18px; }
  @media (min-width:1000px) { .adds { grid-template-columns:repeat(6, 1fr); } }
  .block[data-type=list] { --c:var(--orange); }
  .block .title { width:100%; border:0; outline:0; background:transparent; font-family:var(--display); font-weight:800; font-size:22px; padding:0 0 6px; }
  .block .title::placeholder { color:var(--mute); font-weight:700; }
  .magic { border:0; border-radius:12px; height:40px; padding:0 14px; font-weight:700; color:#fff; background:linear-gradient(120deg, var(--violet), var(--pink)); }
  .checks { margin:2px 0 0; padding:0; list-style:none; }
  .checks li { display:flex; gap:10px; align-items:flex-start; font-size:17px; padding:3px 0; }
  .checks li::before { content:""; flex:none; width:16px; height:16px; margin-top:4px; border:2px solid var(--ink); border-radius:4px; }
  .checks.round li::before { border-radius:50%; }
  .checks li.done::before { background:var(--ink); box-shadow:inset 0 0 0 2px var(--card); }
  .checks li.done { color:var(--mute); }
  .add { border:0; background:var(--card); box-shadow:var(--shadow); border-radius:18px; padding:14px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:6px; font-weight:600; font-size:13px; transition:transform .12s; }
  .add:active { transform:scale(.94); }
  .add i { width:44px; height:44px; border-radius:14px; display:grid; place-items:center; font-style:normal; font-size:22px; background:var(--c); color:#fff; font-weight:800; }
  .drop { margin-top:12px; border:2px dashed var(--line); border-radius:18px; padding:16px; text-align:center; color:var(--mute); font-size:14px; outline:0; transition:border-color .15s, background .15s; -webkit-user-select:text; user-select:text; }
  .drop b { color:var(--ink); }
  .drop:focus, .drop.over { border-color:var(--pink); background:rgba(255,79,139,.06); }
  body.dragging .drop { border-color:var(--pink); }

  /* ---------- Aperçu ---------- */
  .stage { background:linear-gradient(160deg, #2A2633, #17151D); border-radius:28px; padding:22px 18px 26px; box-shadow:var(--shadow); }
  .slot { height:12px; border-radius:6px; background:#0B0A0F; margin:0 10px 0; box-shadow:inset 0 2px 4px rgba(0,0,0,.6); }
  .paperwrap { max-height:calc(100vh - 260px); overflow:auto; margin:-6px 18px 0; padding-bottom:6px; scrollbar-width:thin; }
  .paper { display:flex; flex-direction:column; gap:14px; }
  .paper canvas { width:100%; height:auto; display:block; image-rendering:pixelated; background:#fff; }
  .paper.tpe canvas { -webkit-mask:conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/12px 7px repeat-x, linear-gradient(#000 0 0) top/100% calc(100% - 6px) no-repeat;
    mask:conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/12px 7px repeat-x, linear-gradient(#000 0 0) top/100% calc(100% - 6px) no-repeat; }
  .paper.dymo canvas { border-radius:10px; }
  .paper.printing { animation:feed 1.2s ease-in-out infinite alternate; }
  @keyframes feed { to { transform:translateY(-10px); } }
  .info { text-align:center; color:#B9B2C6; font-size:13px; margin-top:14px; }
  .info.warn { color:var(--yellow); }

  /* ---------- Barre d'impression ---------- */
  .bar { position:fixed; left:0; right:0; bottom:0; z-index:20; padding:12px 20px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 70%, transparent); }
  .bar-in { max-width:1180px; margin:0 auto; display:flex; gap:12px; align-items:center; justify-content:flex-end; }
  .copies { display:flex; align-items:center; background:var(--card); box-shadow:var(--shadow); border-radius:18px; height:58px; padding:0 6px; }
  .copies button { border:0; background:transparent; width:40px; height:44px; font-size:22px; font-weight:700; border-radius:12px; }
  .copies .cnum { display:flex; flex-direction:column; align-items:center; min-width:70px; line-height:1; }
  .copies input { width:56px; border:0; background:transparent; text-align:center; font-family:var(--display); font-weight:800; font-size:22px; padding:0; outline:0; -moz-appearance:textfield; }
  .copies input::-webkit-inner-spin-button, .copies input::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  .copies small { font-size:11px; color:var(--mute); margin-top:3px; }
  .copies.multi { box-shadow:0 0 0 2px var(--pink), var(--shadow); }
  .print { position:relative; overflow:hidden; border:0; height:58px; padding:0 30px; border-radius:18px; color:#fff; font-family:var(--display); font-weight:800; font-size:20px;
    background:linear-gradient(120deg, var(--pink), var(--orange)); box-shadow:0 8px 24px rgba(255,79,139,.35); min-width:200px; transition:transform .12s; }
  .print:active { transform:scale(.97); }
  .print .fill { position:absolute; left:0; top:0; bottom:0; width:0; background:rgba(255,255,255,.28); transition:width .15s; }
  .print span { position:relative; }
  .print:disabled { opacity:.9; }

  /* ---------- Toast, feuille, confettis ---------- */
  .toast { position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); opacity:0; z-index:30;
    background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:14px; font-weight:600; font-size:14px; max-width:min(520px, 90vw); text-align:center;
    transition:all .25s; pointer-events:none; }
  .toast.show { opacity:1; transform:translate(-50%, 0); }
  .toast.err { background:var(--pink); color:#fff; }
  .toast.act { pointer-events:auto; display:flex; align-items:center; gap:14px; }
  .toast button { border:0; background:var(--pink); color:#fff; font-weight:700; border-radius:10px; padding:7px 12px; }
  .sheet-bg { position:fixed; inset:0; background:rgba(10,8,15,.45); z-index:40; display:none; align-items:flex-end; justify-content:center; }
  .sheet-bg.open { display:flex; }
  .sheet { background:var(--card); width:min(560px, 100%); border-radius:26px 26px 0 0; padding:20px 22px calc(24px + env(safe-area-inset-bottom)); max-height:85vh; overflow:auto; animation:up .25s ease-out; }
  @keyframes up { from { transform:translateY(40px); opacity:0; } }
  .sheet h3 { font-family:var(--display); font-size:22px; margin:0 0 14px; }
  .sheet .line { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .sheet .btn { border:0; background:var(--bg); border-radius:12px; padding:10px 14px; font-weight:600; }
  .sheet .btn.danger { color:var(--pink); }
  .sheet a { color:var(--violet); }
  #log { font:12px/1.5 ui-monospace, Menlo, monospace; white-space:pre-wrap; max-height:160px; overflow:auto; color:var(--mute); margin-top:12px; }
  .confetti { position:fixed; z-index:50; pointer-events:none; font-size:24px; animation:boom 1.1s ease-out forwards; }
  @keyframes boom { to { transform:translate(var(--dx), var(--dy)) rotate(var(--r)); opacity:0; } }
  .empty { text-align:center; color:var(--mute); padding:26px 10px 6px; font-size:15px; }
  .empty b { display:block; font-family:var(--display); font-size:22px; color:var(--ink); margin-bottom:4px; }
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <h1>Zebra <span>Studio</span></h1>
  <button class="pill" id="btnConnect"><span class="dot"></span><span id="state">Connecter</span></button>
  <button class="round" id="btnWipe" aria-label="Tout effacer" title="Tout effacer">🧹</button>
  <button class="round" id="btnSettings" aria-label="Réglages">⚙︎</button>
</header>

<main>
  <section>
    <div class="modes">
      <button class="mode" data-mode="tpe"><b>Ticket</b><small>Long, sans limite</small></button>
      <button class="mode" data-mode="dymo"><b>Étiquette</b><small>DYMO 54 × 101 mm</small></button>
    </div>

    <div class="chips" id="fonts"></div>

    <div id="labelEditor"></div>
    <div id="freeEditor">
    <div id="blocks"></div>

    <div class="adds">
      <button class="add" data-add="text"><i style="--c:var(--violet)">Aa</i>Texte</button>
      <button class="add" data-add="list"><i style="--c:var(--orange)">☑︎</i>Liste</button>
      <button class="add" data-add="file"><i style="--c:var(--pink)">＋</i>Photo / fichier</button>
      <button class="add" data-add="qr"><i style="--c:var(--blue)">▦</i>QR code</button>
      <button class="add" data-add="sep"><i style="--c:var(--yellow)">✂︎</i>Trait</button>
      <button class="add" data-add="space"><i style="--c:var(--mint)">↕</i>Espace</button>
    </div>
    <p class="hint-move">Astuce : appui long sur un bloc pour le déplacer</p>
    <div class="drop" id="drop" contenteditable="true" inputmode="none" spellcheck="false">
      <b>Colle ou glisse ici</b> une photo, un PDF, un fichier .md ou du texte
    </div>
    </div>
  </section>

  <aside class="side">
    <div class="stage">
      <div class="slot"></div>
      <div class="paperwrap"><div class="paper" id="paper"></div></div>
      <div class="info" id="info"></div>
    </div>
  </aside>
</main>

<div class="bar"><div class="bar-in">
  <div class="copies"><button id="cMinus" aria-label="Moins">−</button>
    <label class="cnum"><input id="cVal" type="number" inputmode="numeric" min="1" max="50" value="1" aria-label="Nombre d'exemplaires"><small id="cLab">exemplaire</small></label>
    <button id="cPlus" aria-label="Plus">+</button></div>
  <button class="print" id="btnPrint"><div class="fill" id="fill"></div><span id="printLabel">Imprimer</span></button>
</div></div>

<div class="toast" id="toast"></div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <h3>Réglages</h3>
    <div class="line"><span>Vitesse d'envoi Bluetooth</span>
      <span class="seg" id="chunkSeg">
        <button data-v="20">Sûr</button><button data-v="100">Rapide</button><button data-v="180">Turbo</button>
      </span>
    </div>
    <div class="line"><span id="appVersion">Version</span><button class="btn" id="btnUpdate">Charger la dernière version</button></div>
    <div class="line"><span>Code ZPL de la composition</span><button class="btn" id="btnCopyZpl">Copier</button></div>
    <div class="line"><span>Page de test Bluetooth</span><a href="test-ble.html">Ouvrir</a></div>
    <div class="line"><span>Repartir d'une page blanche</span><button class="btn danger" id="btnClear">Tout effacer</button></div>
    <div id="log"></div>
  </div>
</div>

<div class="sheet-bg" id="aiBg"><div class="sheet" id="aiSheet"></div></div>

<input type="file" id="filePick" multiple hidden>
<input type="file" id="fileReplace" accept="image/*,application/pdf,.pdf" hidden>

<script src="lib/qrcode.js"></script>
<script src="lib/qrcode_UTF8.js"></script>
<script src="lib/pdf.min.js"></script>
<script src="engine.js?v=202611070154"></script>
<script src="label.js?v=202611070154"></script>
<script src="app.js?v=202611070154"></script>
</body>
</html>
